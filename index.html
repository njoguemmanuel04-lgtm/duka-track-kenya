<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duka Ke - Multitenant POS & Inventory</title>
    <!-- Tailwind CSS for modern, clean UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

    <!-- AUTHENTICATION CONTAINER (Shown if not logged in) -->
    <div id="auth-container" class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
        <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-extrabold text-emerald-600">Duka Manager</h1>
                <p class="text-sm text-gray-500 mt-1">Sign in to access your shop dashboard</p>
            </div>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600">Email Address</label>
                    <input type="email" id="email" required class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="owner@duka.co.ke">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600">Password</label>
                    <input type="password" id="password" required class="mt-1 w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition duration-200">
                    Sign In
                </button>
            </form>
            <div id="auth-error" class="mt-4 text-center text-sm text-red-500 font-medium"></div>
        </div>
    </div>

    <!-- MAIN APP CONTAINER (Hidden until logged in) -->
    <div id="app-container" class="hidden min-h-screen flex flex-col">
        <!-- Top Navbar -->
        <header class="bg-emerald-700 text-white shadow">
            <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <span class="text-xl font-bold tracking-tight">🛒 Duka OS</span>
                    <span id="shop-name-badge" class="bg-emerald-800 text-emerald-200 text-xs px-2.5 py-1 rounded-full font-medium">Loading Duka...</span>
                </div>
                <div class="flex items-center space-x-4">
                    <span id="user-email-display" class="text-sm text-emerald-100 hidden sm:inline"></span>
                    <button id="logout-btn" class="bg-emerald-800 hover:bg-emerald-900 text-xs px-3 py-1.5 rounded font-semibold transition">
                        Logout
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Workspace Grid -->
        <main class="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Left 2 Cols: Product Catalog & POS Selection -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Add Product Quick Form -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-bold text-gray-800 mb-3">Add New Inventory Item</h2>
                    <form id="add-product-form" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                        <input type="text" id="prod-name" placeholder="Item Name" required class="px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500">
                        <input type="number" step="0.01" id="prod-price" placeholder="Selling Price (KES)" required class="px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500">
                        <input type="number" id="prod-qty" placeholder="Stock Qty" required class="px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-emerald-500">
                        <button type="submit" class="bg-gray-900 hover:bg-black text-white text-sm font-semibold py-2 rounded-lg transition">Add Item</button>
                    </form>
                </div>

                <!-- Product Catalog Grid -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-bold text-gray-800 mb-4">Shop Inventory (Click to add to cart)</h2>
                    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                        <p class="text-gray-400 text-sm">Loading products...</p>
                    </div>
                </div>
            </div>

            <!-- Right Col: POS Checkout & Cart -->
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-between">
                <div>
                    <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Current Sale / Cart</h2>
                    <div id="cart-items" class="space-y-3 max-h-80 overflow-y-auto pr-1">
                        <p class="text-gray-400 text-sm italic">Cart is empty</p>
                    </div>
                </div>

                <div class="mt-6 border-t pt-4">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-base font-semibold text-gray-600">Total:</span>
                        <span id="cart-total" class="text-2xl font-black text-emerald-600">KES 0.00</span>
                    </div>
                    <div class="space-y-2">
                        <button id="checkout-cash-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-md">
                            Complete Sale (Cash)
                        </button>
                        <button id="checkout-mpesa-btn" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 rounded-xl transition shadow-md flex items-center justify-center space-x-2">
                            <span>Lipa Na M-Pesa (STK Push)</span>
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- CLIENT SCRIPT LOGIC -->
    <script>
        // SUPABASE CONFIGURATION (Configured with your credentials)
        const SUPABASE_URL = 'https://torzbgvwjhthzuifdses.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvcnpiZ3Z3amh0aHp1aWZkc2VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyODQ4OTAsImV4cCI6MjEwODg2MDg5MH0.Jjzgt-mCxA94Y1lG6fLDLupteE8RZs6dygJO5BVClKY';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentShopId = null;
        let cart = [];

        // DOM Elements
        const authContainer = document.getElementById('auth-container');
        const appContainer = document.getElementById('app-container');
        const loginForm = document.getElementById('login-form');
        const authError = document.getElementById('auth-error');
        const logoutBtn = document.getElementById('logout-btn');
        const shopBadge = document.getElementById('shop-name-badge');
        const userEmailDisplay = document.getElementById('user-email-display');
        const productGrid = document.getElementById('product-grid');
        const addProductForm = document.getElementById('add-product-form');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartTotalDisplay = document.getElementById('cart-total');
        const checkoutCashBtn = document.getElementById('checkout-cash-btn');

        // Check active session on load
        async function checkUserSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                authContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
                userEmailDisplay.textContent = session.user.email;
                await loadTenantContext(session.user.id);
            } else {
                authContainer.classList.remove('hidden');
                appContainer.classList.add('hidden');
            }
        }

        // Login Event
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            authError.textContent = '';
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                authError.textContent = error.message;
            } else {
                checkUserSession();
            }
        });

        // Logout Event
        logoutBtn.addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.reload();
        });

        // Load Shop & Profile Context
        async function loadTenantContext(userId) {
            const { data: profile, error } = await supabaseClient
                .from('profiles')
                .select('shop_id, shops(name)')
                .eq('id', userId)
                .single();

            if (profile && profile.shop_id) {
                currentShopId = profile.shop_id;
                shopBadge.textContent = profile.shops.name;
                fetchProducts();
            } else {
                shopBadge.textContent = 'No Shop Assigned';
            }
        }

        // Fetch Products (RLS automatically enforces shop isolation)
        async function fetchProducts() {
            const { data: products, error } = await supabaseClient
                .from('products')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Error fetching products:', error);
                return;
            }

            productGrid.innerHTML = '';
            if (products.length === 0) {
                productGrid.innerHTML = '<p class="text-gray-400 text-sm">No items in inventory. Add one above!</p>';
                return;
            }

            products.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'border rounded-lg p-3 hover:shadow-md transition cursor-pointer flex flex-col justify-between bg-gray-50';
                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-gray-800">${prod.name}</h3>
                        <p class="text-emerald-600 font-semibold mt-1">KES ${prod.selling_price.toFixed(2)}</p>
                    </div>
                    <div class="flex justify-between items-center mt-3 pt-2 border-t text-xs text-gray-500">
                        <span>Stock: ${prod.stock_qty}</span>
                        <span class="text-emerald-700 font-semibold uppercase tracking-wider">+ Add</span>
                    </div>
                `;
                card.addEventListener('click', () => addToCart(prod));
                productGrid.appendChild(card);
            });
        }

        // Add Product to Inventory
        addProductForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('prod-name').value;
            const selling_price = parseFloat(document.getElementById('prod-price').value);
            const stock_qty = parseInt(document.getElementById('prod-qty').value);

            const { error } = await supabaseClient
                .from('products')
                .insert([{ shop_id: currentShopId, name, selling_price, buying_price: selling_price * 0.7, stock_qty }]);

            if (error) {
                alert('Error adding product: ' + error.message);
            } else {
                addProductForm.reset();
                fetchProducts();
            }
        });

        // Cart Logic
        function addToCart(product) {
            const existing = cart.find(item => item.id === product.id);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            renderCart();
        }

        function renderCart() {
            cartItemsContainer.innerHTML = '';
            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p class="text-gray-400 text-sm italic">Cart is empty</p>';
                cartTotalDisplay.textContent = 'KES 0.00';
                return;
            }

            let total = 0;
            cart.forEach(item => {
                total += item.selling_price * item.qty;
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center text-sm border-b pb-2';
                div.innerHTML = `
                    <div>
                        <p class="font-medium text-gray-800">${item.name}</p>
                        <p class="text-xs text-gray-500">${item.qty} x KES ${item.selling_price}</p>
                    </div>
                    <span class="font-bold text-gray-700">KES ${(item.selling_price * item.qty).toFixed(2)}</span>
                `;
                cartItemsContainer.appendChild(div);
            });
            cartTotalDisplay.textContent = `KES ${total.toFixed(2)}`;
        }

        // Checkout Cash Transaction
        checkoutCashBtn.addEventListener('click', async () => {
            if (cart.length === 0) return alert('Cart is empty!');

            let totalAmount = cart.reduce((acc, item) => acc + (item.selling_price * item.qty), 0);

            // Insert into Sales table
            const { error } = await supabaseClient
                .from('sales')
                .insert([{ shop_id: currentShopId, total_amount: totalAmount, payment_method: 'CASH' }]);

            if (error) {
                alert('Checkout failed: ' + error.message);
            } else {
                alert('Sale completed successfully!');
                cart = [];
                renderCart();
            }
        });

        // Initialize App Check
        checkUserSession();
    </script>
</body>
</html>
