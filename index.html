        function saveShopsList() {
            localStorage.setItem('dukatrack_shops_list', JSON.stringify(registeredShops));

        // Render Directory instantly from LocalStorage/State
        function renderDirectory() {
            const listElem = document.getElementById('shopDirectoryList');
            if (!listElem) return;

            listElem.innerHTML = '';
            if (!registeredShops || registeredShops.length === 0) {
                listElem.innerHTML = `<p class="text-xs text-gray-400 italic py-2 text-center">No dukas registered yet.</p>`;
                return;
            }

            registeredShops.forEach(shop => {
                listElem.innerHTML += `
                    <div class="flex justify-between items-center p-3 rounded-2xl border border-gray-100 bg-gray-50/50 hover:bg-gray-100 transition-all">
                        <div>
                            <div class="font-bold text-gray-800 text-sm flex items-center gap-1.5">
                                🛒 ${shop.name}
                            </div>
                            <div class="text-xs text-gray-400 font-medium">${shop.location || 'Mwea'}</div>
                        </div>
                        <button onclick="enterShop('${shop.id}')" class="text-xs font-bold text-emerald-700 bg-emerald-100/80 hover:bg-emerald-200 px-3 py-1.5 rounded-xl transition-all">
                            Enter →
                        </button>
                    </div>
                `;
            });

            // Background cloud sync check (non-blocking)
            if (supabase) {
                supabase.from('dukas').select('*').then(({ data, error }) => {
                    if (!error && data && data.length > 0) {
                        let updated = false;
                        data.forEach(cd => {
                            if (!registeredShops.some(s => s.id === cd.id)) {
                                registeredShops.push({ id: cd.id, name: cd.name, phone: cd.phone, location: cd.location });
                                updated = true;
                            }
                        });
                        if (updated) {
                            saveShopsList();
                            renderDirectory();
                        }
                    }
                }).catch(() => {});
            }
        }

        function handleCreateShop(event) {
            event.preventDefault();
            const nameInput = document.getElementById('newShopName');
            const phoneInput = document.getElementById('newShopPhone');
            const locInput = document.getElementById('newShopLocation');
            const pinInput = document.getElementById('newShopPin');

            if (!nameInput || !phoneInput || !pinInput) return;

            const name = nameInput.value.trim();
            const phone = phoneInput.value.trim();
            const location = locInput ? (locInput.value.trim() || "Mwea") : "Mwea";
            const pin = pinInput.value.trim();

            const shopId = 'duka_' + Date.now();
            const newShop = { id: shopId, name, phone, location, pin };

            registeredShops.push(newShop);
            saveShopsList();
            renderDirectory();

            nameInput.value = '';
            phoneInput.value = '';
            if (locInput) locInput.value = '';
            pinInput.value = '';

            // Non-blocking background cloud save
            if (supabase) {
                supabase.from('dukas').insert([{ id: shopId, name, phone, location, pin }]).then(() => {}).catch(() => {});
            }

            enterShop(shopId);
        }

        function enterShop(shopId) {

                products: '++id, barcode, name, stock, unit, price, buying_price, min_stock',

                    { barcode: '6001000004', name: 'Sugar', stock: 30, unit: 'kg', price: 160, buying_price: 135, min_stock: 10 },

        function exitToDirectory() {
            const landing = document.getElementById('view-landing');
            const app = document.getElementById('view-app');
            if (app) app.classList.add('hidden');
            if (landing) landing.classList.remove('hidden');
            renderDirectory();

        function switchTab(tabName) {
            ['dashboard', 'sales', 'inventory', 'profile'].forEach(tab => {
                const tabElem = document.getElementById(`tab-${tab}`);
                const navElem = document.getElementById(`nav-${tab}`);
                if (tabElem) tabElem.classList.add('hidden');
                if (navElem) navElem.className = "flex flex-col items-center text-gray-400 hover:text-emerald-600 transition-colors";
            });

            const activeTab = document.getElementById(`tab-${tabName}`);
            const activeNav = document.getElementById(`nav-${tabName}`);
            if (activeTab) activeTab.classList.remove('hidden');
            if (activeNav) activeNav.className = "flex flex-col items-center text-emerald-600 font-bold transition-colors";
            
            loadAppData();
        }

        async function loadAppData() {
            if (!db) return;
            await loadDashboard();
            await loadInventoryView();
            await loadSalesHistory();
            await loadDebtsList();
            await checkLowStockAlerts();
            syncLocalDataToCloud();
        }

        async function syncLocalDataToCloud() {
            if (!supabase || !activeShop) return;
            try {
                const unsyncedSales = await db.sales.where('synced').equals(0).toArray();
                for (let s of unsyncedSales) {
                    const { error } = await supabase.from('sales').insert([{
                        duka_id: activeShop.id,
                        total: s.total,
                        profit: s.profit,
                        method: s.method,
                        customer: s.customer,
                        created_at: s.created_at
                    }]);
                    if (!error) await db.sales.update(s.id, { synced: 1 });
                }
            } catch(e) {}
        }

        async function checkLowStockAlerts() {
            const products = await db.products.toArray();
            const lowItems = products.filter(p => p.stock <= p.min_stock);
            const banner = document.getElementById('lowStockBanner');
            if (!banner) return;
            
            if (lowItems.length > 0) {
                const msgElem = document.getElementById('lowStockMessage');
                if (msgElem) msgElem.innerText = `Warning: ${lowItems.length} product(s) low in stock!`;
                banner.classList.remove('hidden');
            } else {
                banner.classList.add('hidden');
            }
        }

        async function loadDashboard() {
            const products = await db.products.toArray();
            const previewElem = document.getElementById('dashboardProductList');
            if (!previewElem) return;
            previewElem.innerHTML = '';

            products.slice(0, 3).forEach(item => {
                const isLow = item.stock <= item.min_stock;

        async function loadInventoryView() {

        async function filterInventorySearch() {
            const searchInput = document.getElementById('inventorySearch');

            const query = searchInput.value.toLowerCase().trim();
            const products = await db.products.toArray();
            const filtered = products.filter(p => p.name.toLowerCase().includes(query) || (p.barcode && p.barcode.includes(query)));

        async function loadDebtsList() {
            const debts = await db.debts.where('settled').equals(0).toArray();
            const debtListElem = document.getElementById('dashboardDebtList');
            if (!debtListElem) return;
            debtListElem.innerHTML = '';

            let totalOutstanding = 0;
            if (debts.length === 0) {
                debtListElem.innerHTML = `<p class="text-xs text-gray-400 italic">No active customer debts.</p>`;
            } else {
                debts.forEach(d => {
                    totalOutstanding += d.amount;
                    debtListElem.innerHTML += `
                        <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-xl border border-gray-100">
                            <div>

            const badge = document.getElementById('totalDebtBadge');
            if (badge) badge.innerText = `Total: Ksh ${totalOutstanding.toLocaleString()}`;
        }

        async function settleDebt(debtId) {
            const debt = await db.debts.get(debtId);
            if (!debt) return;

            const confirmSettle = confirm(`Has ${debt.customer_name} paid their debt of Ksh ${debt.amount.toLocaleString()}?`);
            if (!confirmSettle) return;

            await db.debts.update(debtId, { settled: 1 });
            
            await db.sales.add({
                total: debt.amount,
                profit: 0,
                method: 'CASH (DEBT PAID)',
                customer: debt.customer_name,
                synced: 0,
                created_at: new Date().toISOString()
            });

            alert(`✅ Debt settled for ${debt.customer_name}!`);
            loadAppData();
        }

        async function logExpensePrompt() {
            const title = prompt("Expense Description (e.g. Tokens, Transport):");
            if (!title) return;
            const amount = parseFloat(prompt("Expense Amount (Ksh):"));
            if (isNaN(amount) || amount <= 0) return;

            await db.expenses.add({
                title,
                amount,
                created_at: new Date().toISOString()
            });

            if (supabase && activeShop) {
                try {
                    await supabase.from('expenses').insert([{ duka_id: activeShop.id, title, amount }]);
                } catch(e) {}
            }

            alert(`Logged expense: ${title} - Ksh ${amount}`);
            loadAppData();
        }

        async function sellSingleProduct(productId) {
            const product = await db.products.get(productId);
            if (!product || product.stock <= 0) {
                alert("Item out of stock!");
                return;
            }

            const qtyStr = prompt(`Selling ${product.name} (Sell: Ksh ${product.price}/${product.unit})\nAvailable Stock: ${product.stock} ${product.unit}\n\nEnter Quantity to sell:`, "1");
            if (!qtyStr) return;
            const qty = parseFloat(qtyStr);

            if (isNaN(qty) || qty <= 0) {
                alert("Please enter a valid quantity!");
                return;
            }

            if (qty > product.stock) {
                alert(`Insufficient stock! You only have ${product.stock} ${product.unit} available.`);
                return;
            }

            const totalPrice = qty * product.price;
            const buyingPrice = product.buying_price || (product.price * 0.8);
            const totalProfit = qty * (product.price - buyingPrice);

            let method = prompt(`Selling ${qty} ${product.unit} of ${product.name}.\nTotal: Ksh ${totalPrice.toLocaleString()}\n\nSelect Payment Method (MPESA, CASH, CREDIT):`, "MPESA");
            if (!method) return;
            method = method.toUpperCase();

            let customerName = "";
            if (method === 'CREDIT' || method === 'MKOPO') {
                method = 'CREDIT';
                customerName = prompt("Enter Customer Name for this Mkopo:", "Customer");
                if (!customerName) return;

                await db.debts.add({
                    customer_name: customerName,
                    amount: totalPrice,
                    settled: 0,
                    created_at: new Date().toISOString()
                });
            }

            await db.products.update(productId, { stock: product.stock - qty });
            await db.sales.add({
                total: totalPrice,
                profit: totalProfit,
                method: method,
                customer: customerName,
                synced: 0,
                created_at: new Date().toISOString()
            });
            
            alert(`✅ Sale recorded!\nTotal: Ksh ${totalPrice.toLocaleString()}`);
            loadAppData();
        }

        async function quickSaleModal() {
            const amount = parseFloat(prompt("Enter total sale amount (Ksh):"));
            if (isNaN(amount) || amount <= 0) return;
            
            let method = prompt("Enter payment method (MPESA / CASH / CREDIT):", "MPESA");
            if (!method) return;
            method = method.toUpperCase();

            let customerName = "";

                customerName = prompt("Enter Customer Name for this Mkopo:", "Customer");
                if (!customerName) return;

                await db.debts.add({
                    customer_name: customerName,
                    amount: amount,
                    settled: 0,
                    created_at: new Date().toISOString()
                });
            }

            const estimatedProfit = amount * 0.20;

            await db.sales.add({
                total: amount,
                profit: estimatedProfit,
                method: method,
                customer: customerName,
                synced: 0,
                created_at: new Date().toISOString()
            });
            loadAppData();
        }

        async function addNewProductPrompt() {
            const name = prompt("Product Name (e.g., Rice, Sugar):");
            if (!name) return;
            const barcode = prompt("Scan/Enter Barcode Number (Optional):", "");
            const buyingPrice = parseFloat(prompt("Buying Price per unit (Ksh):"));

            const unit = prompt("Unit (e.g., kg, L, pcs):", "kg");

            if (!isNaN(price) && !isNaN(stock)) {

                await db.products.add({ 
                    barcode: barcode || null,
                    name, 
                    price, 
                    buying_price: bPrice, 
                    stock,

                if (supabase && activeShop) {
                    try {
                        await supabase.from('products').insert([{
                            duka_id: activeShop.id,

                            stock,
                            unit: unit || 'pcs'
                        }]);

                loadAppData();

        }

        async function editStock(productId) {
            const product = await db.products.get(productId);
            if (!product) return;
            const newStock = parseInt(prompt(`Update stock quantity for ${product.name}:`, product.stock));
            if (!isNaN(newStock)) {
                await db.products.update(productId, { stock: newStock });
                loadAppData();
            }
        }

        async function calculateMetrics() {
            const today = new Date().toISOString().split('T')[0];
            const sales = await db.sales.toArray();
            const expenses = await db.expenses.toArray();

            const todaySales = sales.filter(s => s.created_at.startsWith(today));
            const todayExpenses = expenses.filter(e => e.created_at.startsWith(today));

            let totalSales = 0, grossProfit = 0, mpesa = 0, cash = 0, credit = 0;
            todaySales.forEach(s => {
                totalSales += s.total;
                grossProfit += (s.profit || 0);
                if (s.method === 'MPESA') mpesa += s.total;
                else if (s.method === 'CASH' || s.method.includes('CASH')) cash += s.total;
                else if (s.method === 'CREDIT') credit += s.total;
            });

            let totalExpenseAmt = 0;
            todayExpenses.forEach(e => totalExpenseAmt += e.amount);

            const netProfit = grossProfit - totalExpenseAmt;
            const count = todaySales.length;
            const avg = count > 0 ? Math.round(totalSales / count) : 0;

            const sToday = document.getElementById('salesToday');
            const pToday = document.getElementById('profitToday');
            const oCount = document.getElementById('orderCount');
            const aOrder = document.getElementById('avgOrder');
            const mSales = document.getElementById('mpesaSales');
            const cSales = document.getElementById('cashSales');
            const crSales = document.getElementById('creditSales');
            const expToday = document.getElementById('expensesToday');

            if (sToday) sToday.innerText = `Ksh ${totalSales.toLocaleString()}`;
            if (pToday) pToday.innerText = `Ksh ${netProfit.toLocaleString()}`;
            if (oCount) oCount.innerText = count;
            if (aOrder) aOrder.innerText = `Ksh ${avg.toLocaleString()}`;
            if (mSales) mSales.innerText = `Ksh ${mpesa.toLocaleString()}`;
            if (cSales) cSales.innerText = `Ksh ${cash.toLocaleString()}`;
            if (crSales) crSales.innerText = `Ksh ${credit.toLocaleString()}`;
            if (expToday) expToday.innerText = `Ksh ${totalExpenseAmt.toLocaleString()}`;
        }

        // BARCODE SCANNER CONTROLLER
        function startBarcodeScan() {
            const modal = document.getElementById('scannerModal');
            if (modal) modal.classList.remove('hidden');
            html5QrCodeScanner = new Html5Qrcode("interactiveScanner");
            html5QrCodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 150 } },
                async (decodedText) => {
                    stopBarcodeScan();
                    const product = await db.products.where('barcode').equals(decodedText).first();
                    if (product) {
                        sellSingleProduct(product.id);
                    } else {
                        alert(`No product found with barcode: ${decodedText}`);
                    }
                },
                (error) => {}
            ).catch(err => {
                alert("Camera permission error or not supported.");
                stopBarcodeScan();
            });
        }

        function stopBarcodeScan() {
            if (html5QrCodeScanner) {
                html5QrCodeScanner.stop().then(() => {
                    const modal = document.getElementById('scannerModal');
                    if (modal) modal.classList.add('hidden');
                }).catch(() => {
                    const modal = document.getElementById('scannerModal');
                    if (modal) modal.classList.add('hidden');
                });
            } else {
                const modal = document.getElementById('scannerModal');
                if (modal) modal.classList.add('hidden');
            }
        }

        // WHATSAPP END-OF-DAY SUMMARY REPORT
        async function shareWhatsAppReport() {
            const today = new Date().toLocaleDateString();
            const salesElem = document.getElementById('salesToday');
            const profitElem = document.getElementById('profitToday');
            const mpesaElem = document.getElementById('mpesaSales');
            const cashElem = document.getElementById('cashSales');
            const debtElem = document.getElementById('creditSales');
            const expenseElem = document.getElementById('expensesToday');

            const salesStr = salesElem ? salesElem.innerText : 'Ksh 0';
            const profitStr = profitElem ? profitElem.innerText : 'Ksh 0';
            const mpesaStr = mpesaElem ? mpesaElem.innerText : 'Ksh 0';
            const cashStr = cashElem ? cashElem.innerText : 'Ksh 0';
            const debtStr = debtElem ? debtElem.innerText : 'Ksh 0';
            const expenseStr = expenseElem ? expenseElem.innerText : 'Ksh 0';

            const msg = `📊 *DUKATRACK DAILY REPORT* - ${activeShop ? activeShop.name : 'Duka'}\n📅 Date: ${today}\n------------------------------\n💰 Total Sales: ${salesStr}\n💵 Cash Received: ${cashStr}\n📱 M-Pesa Total: ${mpesaStr}\n` +
                        `📕 Mkopo (Debts): ${debtStr}\n💸 Expenses Today: ${expenseStr}\n------------------------------\n📈 *NET PROFIT: ${profitStr}*`;

            const encodedMsg = encodeURIComponent(msg);
            window.open(`https://wa.me/?text=${encodedMsg}`, '_blank');
        }

        // Boot execution
        renderDirectory();
    </script>
