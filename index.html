<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DukaPOS - Kenya Duka Manager</title>
    <!-- Tailwind CSS for UI Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Dexie.js for IndexedDB Offline Engine -->
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans pb-20">

    <!-- TOP HEADER -->
    <header class="bg-white px-4 py-3 shadow-sm sticky top-0 z-50 flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="bg-emerald-600 text-white p-2 rounded-lg">
                <i class="fa-solid fa-store text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-gray-800 text-lg leading-none">DukaPOS</h1>
                <span id="networkStatus" class="text-xs font-semibold text-emerald-600">● Offline Ready</span>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="triggerSync()" class="p-2 text-gray-600 hover:text-emerald-600 text-sm flex items-center gap-1 bg-gray-100 rounded-lg">
                <i class="fa-solid fa-rotate"></i> Sync
            </button>
            <i class="fa-solid fa-bell text-gray-500 text-lg"></i>
        </div>
    </header>

    <!-- MAIN DASHBOARD CONTENT -->
    <main class="p-4 max-w-md mx-auto space-y-5">

        <!-- DASHBOARD TITLE -->
        <div class="flex justify-between items-center">
            <h2 class="text-xl font-bold text-gray-800">Dashboard</h2>
            <button onclick="quickSaleModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 px-3 rounded-lg shadow-sm flex items-center gap-1">
                <i class="fa-solid fa-plus"></i> New Sale
            </button>
        </div>

        <!-- MAIN SALES CARD -->
        <div class="bg-emerald-100/70 border border-emerald-200 rounded-2xl p-4 shadow-sm">
            <div class="flex items-center space-x-1 text-emerald-800 text-xs font-medium mb-1">
                <i class="fa-solid fa-arrow-trend-up"></i>
                <span>Sales Today</span>
            </div>
            <div id="salesToday" class="text-3xl font-extrabold text-gray-900 mb-3">Ksh 0</div>
            
            <div class="grid grid-cols-2 gap-3">
                <div class="bg-white rounded-xl p-3 shadow-sm">
                    <div class="flex items-center text-emerald-700 text-xs mb-1">
                        <i class="fa-solid fa-receipt mr-1"></i> Orders
                    </div>
                    <div id="orderCount" class="text-xl font-bold text-gray-800">0</div>
                </div>
                <div class="bg-white rounded-xl p-3 shadow-sm">
                    <div class="flex items-center text-emerald-700 text-xs mb-1">
                        <i class="fa-solid fa-chart-simple mr-1"></i> Avg Order
                    </div>
                    <div id="avgOrder" class="text-xl font-bold text-gray-800">Ksh 0</div>
                </div>
            </div>
        </div>

        <!-- SALES ANALYTICS (SUMMARY) -->
        <div class="bg-white rounded-2xl p-4 shadow-sm space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-gray-800 text-sm">Payment Breakdown</h3>
                <span class="text-xs text-gray-400">Today</span>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-gray-50 p-2 rounded-lg border">
                    <div class="text-xs text-gray-500">M-Pesa</div>
                    <div id="mpesaSales" class="font-bold text-gray-800 text-sm">Ksh 0</div>
                </div>
                <div class="bg-gray-50 p-2 rounded-lg border">
                    <div class="text-xs text-gray-500">Cash</div>
                    <div id="cashSales" class="font-bold text-gray-800 text-sm">Ksh 0</div>
                </div>
                <div class="bg-gray-50 p-2 rounded-lg border">
                    <div class="text-xs text-gray-500">Debt (Mkopo)</div>
                    <div id="creditSales" class="font-bold text-red-600 text-sm">Ksh 0</div>
                </div>
            </div>
        </div>

        <!-- INVENTORY SECTION -->
        <div class="space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-gray-800 text-base">Inventory</h3>
                <button onclick="addNewProductPrompt()" class="text-xs font-semibold text-emerald-600 hover:underline">+ Add Product</button>
            </div>

            <div id="productList" class="space-y-2">
                <!-- Products dynamically rendered here -->
            </div>
        </div>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 px-6 py-2 flex justify-between items-center max-w-md mx-auto z-40">
        <button class="flex flex-col items-center text-emerald-600">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-xs font-medium">Dashboard</span>
        </button>
        <button onclick="quickSaleModal()" class="flex flex-col items-center text-gray-400 hover:text-emerald-600">
            <i class="fa-solid fa-receipt text-lg"></i>
            <span class="text-xs font-medium">Sales</span>
        </button>
        <button class="flex flex-col items-center text-gray-400 hover:text-emerald-600">
            <i class="fa-solid fa-box text-lg"></i>
            <span class="text-xs font-medium">Inventory</span>
        </button>
        <button class="flex flex-col items-center text-gray-400 hover:text-emerald-600">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-xs font-medium">Profile</span>
        </button>
    </nav>

    <!-- OFFLINE JAVASCRIPT ENGINE -->
    <script>
        // 1. Initialize IndexedDB database for local store storage
        const db = new Dexie("DukaPOS_DB");
        db.version(1).stores({
            products: '++id, name, stock, unit, price, min_stock',
            sales: '++id, total, method, synced, created_at'
        });

        // Seed Default Kenya Duka Items if DB is fresh
        db.on('populate', () => {
            db.products.bulkAdd([
                { name: 'Ugali Flour', stock: 24, unit: 'kg', price: 180, min_stock: 5 },
                { name: 'Cooking Oil', stock: 12, unit: 'L', price: 350, min_stock: 15 },
                { name: 'Blueband', stock: 18, unit: '500g', price: 220, min_stock: 5 },
                { name: 'Sugar', stock: 30, unit: 'kg', price: 160, min_stock: 10 }
            ]);
        });

        db.open().then(() => loadDashboard());

        // 2. Load Inventory & Render UI
        async function loadDashboard() {
            const products = await db.products.toArray();
            const productListElem = document.getElementById('productList');
            productListElem.innerHTML = '';

            products.forEach(item => {
                const isLow = item.stock <= item.min_stock;
                const statusBadge = isLow 
                    ? `<span class="bg-amber-100 text-amber-700 text-xs px-2 py-0.5 rounded-md font-medium">Low stock</span>`
                    : `<span class="bg-emerald-100 text-emerald-700 text-xs px-2 py-0.5 rounded-md font-medium">In stock</span>`;

                productListElem.innerHTML += `
                    <div class="bg-white rounded-xl p-3 shadow-sm flex justify-between items-center border border-gray-100">
                        <div class="flex items-center space-x-3">
                            <div class="bg-emerald-50 text-emerald-600 p-2 rounded-lg">
                                <i class="fa-solid fa-box-open text-base"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-gray-800 text-sm">${item.name}</h4>
                                <div class="text-xs text-gray-500">${item.stock} ${item.unit} in stock • Ksh ${item.price}/${item.unit}</div>
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-1">
                            ${statusBadge}
                            <button onclick="sellSingleProduct(${item.id})" class="text-xs text-emerald-600 font-bold hover:underline">Quick Sell</button>
                        </div>
                    </div>
                `;
            });

            calculateMetrics();
        }

        // 3. Quick Sale Transaction (Deducts Stock Offline Instantly)
        async function sellSingleProduct(productId) {
            const product = await db.products.get(productId);
            if (!product || product.stock <= 0) {
                alert("Item out of stock!");
                return;
            }

            // Prompt Payment Method
            const method = prompt(`Selling 1 ${product.unit} of ${product.name} for Ksh ${product.price}.\nPayment method? (MPESA, CASH, CREDIT):`, "MPESA");
            if (!method) return;

            // Update Stock locally
            await db.products.update(productId, { stock: product.stock - 1 });

            // Record Sale Record locally
            await db.sales.add({
                total: product.price,
                method: method.toUpperCase(),
                synced: 0,
                created_at: new Date().toISOString()
            });

            loadDashboard();
        }

        // 4. Record Custom Sale
        async function quickSaleModal() {
            const amount = parseFloat(prompt("Enter total sale amount (Ksh):"));
            if (isNaN(amount) || amount <= 0) return;

            const method = prompt("Enter payment method (MPESA / CASH / CREDIT):", "MPESA");
            if (!method) return;

            await db.sales.add({
                total: amount,
                method: method.toUpperCase(),
                synced: 0,
                created_at: new Date().toISOString()
            });

            loadDashboard();
        }

        // 5. Add New Product
        async function addNewProductPrompt() {
            const name = prompt("Product Name (e.g., Milk):");
            const price = parseFloat(prompt("Selling Price per unit (Ksh):"));
            const stock = parseInt(prompt("Initial Stock Quantity:"));
            const unit = prompt("Unit (e.g., kg, L, pcs, 500g):", "pcs");

            if (name && !isNaN(price) && !isNaN(stock)) {
                await db.products.add({ name, price, stock, unit, min_stock: 5 });
                loadDashboard();
            }
        }

        // 6. Calculate Sales Metrics
        async function calculateMetrics() {
            const today = new Date().toISOString().split('T')[0];
            const sales = await db.sales.toArray();
            
            const todaySales = sales.filter(s => s.created_at.startsWith(today));

            let total = 0;
            let mpesa = 0;
            let cash = 0;
            let credit = 0;

            todaySales.forEach(s => {
                total += s.total;
                if (s.method === 'MPESA') mpesa += s.total;
                else if (s.method === 'CASH') cash += s.total;
                else if (s.method === 'CREDIT') credit += s.total;
            });

            const count = todaySales.length;
            const avg = count > 0 ? Math.round(total / count) : 0;

            document.getElementById('salesToday').innerText = `Ksh ${total.toLocaleString()}`;
            document.getElementById('orderCount').innerText = count;
            document.getElementById('avgOrder').innerText = `Ksh ${avg.toLocaleString()}`;

            document.getElementById('mpesaSales').innerText = `Ksh ${mpesa.toLocaleString()}`;
            document.getElementById('cashSales').innerText = `Ksh ${cash.toLocaleString()}`;
            document.getElementById('creditSales').innerText = `Ksh ${credit.toLocaleString()}`;
        }

        // 7. Online / Offline Status Detection
        function updateOnlineStatus() {
            const statusElem = document.getElementById('networkStatus');
            if (navigator.onLine) {
                statusElem.innerHTML = '● Online (Auto-Syncing)';
                statusElem.className = 'text-xs font-semibold text-emerald-600';
            } else {
                statusElem.innerHTML = '● Offline Mode';
                statusElem.className = 'text-xs font-semibold text-amber-600';
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();

        // 8. Manual Sync Trigger (For Cloud Database when online)
        async function triggerSync() {
            if (!navigator.onLine) {
                alert("Device is offline. Connection required to sync with cloud.");
                return;
            }
            const pendingSales = await db.sales.where('synced').equals(0).toArray();
            if (pendingSales.length === 0) {
                alert("All local data is already up to date!");
                return;
            }

            // Simulate sync endpoint call
            await db.sales.where('synced').equals(0).modify({ synced: 1 });
            alert(`${pendingSales.length} offline transactions synced successfully!`);
        }
    </script>
</body>
</html>
