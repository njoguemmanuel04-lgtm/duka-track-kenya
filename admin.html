<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DukaTrack - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-emerald-950 text-gray-900 font-sans antialiased min-h-screen flex flex-col items-center justify-center p-4">

    <!-- ADMIN LOGIN GATE -->
    <div id="admin-auth-container" class="max-w-md w-full bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-black text-emerald-800">DUKATRACK Admin</h1>
            <p class="text-xs text-gray-400 mt-1 uppercase tracking-wider font-semibold">Platform Management Portal</p>
        </div>
        <form id="admin-login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-600">Master Password</label>
                <input type="password" id="admin-pass" required class="mt-1 w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl transition shadow-lg text-sm">
                Access Admin Dashboard
            </button>
        </form>
        <div id="admin-auth-error" class="mt-4 text-center text-xs text-red-500 font-semibold"></div>
    </div>

    <!-- MAIN ADMIN DASHBOARD -->
    <div id="admin-app-container" class="hidden max-w-4xl w-full bg-white rounded-2xl shadow-xl p-6 space-y-6">
        
        <!-- Header Bar -->
        <div class="flex justify-between items-center border-b pb-4">
            <div>
                <h1 class="text-xl font-black text-emerald-800">🛡️ DUKATRACK Admin</h1>
                <p class="text-xs text-gray-400">Platform Management Portal</p>
            </div>
            <div class="flex items-center space-x-3">
                <a href="/" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-3 py-1.5 rounded-lg transition">← Back to POS</a>
                <button id="admin-logout-btn" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 font-semibold px-3 py-1.5 rounded-lg transition">Lock</button>
            </div>
        </div>

        <!-- Metric Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="bg-emerald-50 border border-emerald-100 p-4 rounded-xl flex justify-between items-center">
                <div>
                    <p class="text-xs uppercase font-bold text-emerald-700">Total Shops</p>
                    <h3 id="stat-shops-count" class="text-3xl font-black text-emerald-900 mt-1">0</h3>
                </div>
                <span class="text-2xl">🏪</span>
            </div>
            <div class="bg-blue-50 border border-blue-100 p-4 rounded-xl flex justify-between items-center">
                <div>
                    <p class="text-xs uppercase font-bold text-blue-700">Cloud Status</p>
                    <h3 class="text-lg font-black text-blue-900 mt-1 flex items-center gap-2">Connected <span class="w-2.5 h-2.5 rounded-full bg-green-500 inline-block animate-pulse"></span></h3>
                </div>
                <span class="text-2xl">☁️</span>
            </div>
        </div>

        <!-- Provision Form -->
        <div class="bg-gray-50 border p-4 rounded-xl">
            <h2 class="text-sm font-bold text-gray-800 mb-3 uppercase tracking-wider">Provision New Duka Shop</h2>
            <form id="create-shop-form" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <input type="text" id="new-shop-name" placeholder="Shop Name (e.g. Nakuru Duka)" required class="px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 bg-white">
                <input type="text" id="new-shop-pin" placeholder="Access PIN (e.g. 1234)" required class="px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 bg-white">
                <button type="submit" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold text-sm py-2 rounded-xl transition shadow">Create Shop</button>
            </form>
        </div>

        <!-- Shops List -->
        <div>
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-sm font-bold text-gray-800 uppercase tracking-wider">All Connected Dukas</h2>
                <button onclick="loadAdminData()" class="text-xs text-emerald-700 font-bold hover:underline">Refresh List</button>
            </div>
            <div class="border rounded-xl overflow-hidden">
                <table class="w-full text-left text-sm text-gray-600">
                    <thead class="bg-gray-100 text-gray-700 uppercase text-xs">
                        <tr>
                            <th class="p-3">Shop Name</th>
                            <th class="p-3">PIN</th>
                            <th class="p-3">Created</th>
                            <th class="p-3 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="admin-shops-table">
                        <tr><td colspan="4" class="p-4 text-center text-gray-400 text-xs">Fetching cloud records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- SCRIPT -->
    <script>
        const SUPABASE_URL = 'https://torzbgvwjhthzuifdses.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvcnpiZ3Z3amh0aHp1aWZkc2VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyODQ4OTAsImV4cCI6MjEwODg2MDg5MH0.Jjzgt-mCxA94Y1lG6fLDLupteE8RZs6dygJO5BVClKY';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const MASTER_ADMIN_PASSWORD = 'AdminPassword123';

        const authContainer = document.getElementById('admin-auth-container');
        const appContainer = document.getElementById('admin-app-container');
        const loginForm = document.getElementById('admin-login-form');
        const authError = document.getElementById('admin-auth-error');
        const logoutBtn = document.getElementById('admin-logout-btn');
        const createShopForm = document.getElementById('create-shop-form');
        const shopsTable = document.getElementById('admin-shops-table');

        function checkAdminSession() {
            if (localStorage.getItem('duka_is_super_admin') === 'true') {
                authContainer.classList.add('hidden');
                appContainer.classList.remove('hidden');
                loadAdminData();
            } else {
                authContainer.classList.remove('hidden');
                appContainer.classList.add('hidden');
            }
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            authError.textContent = '';
            if (document.getElementById('admin-pass').value === MASTER_ADMIN_PASSWORD) {
                localStorage.setItem('duka_is_super_admin', 'true');
                checkAdminSession();
            } else {
                authError.textContent = 'Incorrect Password!';
            }
        });

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('duka_is_super_admin');
            window.location.reload();
        });

        async function loadAdminData() {
            shopsTable.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-400 text-xs">Fetching cloud records...</td></tr>';

            const { data: shops, error } = await supabaseClient
                .from('shops')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                shopsTable.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-red-500 text-xs">Error: ${error.message}</td></tr>`;
                return;
            }

            document.getElementById('stat-shops-count').textContent = shops ? shops.length : 0;
            shopsTable.innerHTML = '';

            if (!shops || shops.length === 0) {
                shopsTable.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-400 text-xs">No shops found in database.</td></tr>';
                return;
            }

            shops.forEach(shop => {
                const tr = document.createElement('tr');
                tr.className = 'border-b hover:bg-gray-50';
                tr.innerHTML = `
                    <td class="p-3 font-bold text-gray-800">${shop.shop_name}</td>
                    <td class="p-3 font-mono text-xs bg-gray-50">${shop.pin || '1234'}</td>
                    <td class="p-3 text-xs text-gray-400">${new Date(shop.created_at).toLocaleDateString()}</td>
                    <td class="p-3 text-right">
                        <button onclick="deleteShop('${shop.id}')" class="text-red-500 hover:text-red-700 text-xs font-bold bg-red-50 px-2 py-1 rounded">Delete</button>
                    </td>
                `;
                shopsTable.appendChild(tr);
            });
        }

        createShopForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const shop_name = document.getElementById('new-shop-name').value.trim();
            const pin = document.getElementById('new-shop-pin').value.trim();

            const { error } = await supabaseClient
                .from('shops')
                .insert([{ shop_name, pin }]);

            if (error) {
                alert('Failed: ' + error.message);
            } else {
                alert(`Shop "${shop_name}" created successfully!`);
                createShopForm.reset();
                loadAdminData();
            }
        });

        async function deleteShop(id) {
            if (!confirm('Are you sure you want to delete this shop?')) return;
            const { error } = await supabaseClient.from('shops').delete().eq('id', id);
            if (error) alert('Error: ' + error.message);
            else loadAdminData();
        }

        checkAdminSession();
    </script>
</body>
</html>
