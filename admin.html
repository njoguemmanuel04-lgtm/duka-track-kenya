<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DUKATRACK - Super Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-emerald-900 font-sans min-h-screen p-4 flex justify-center items-center">

    <div class="w-full max-w-md space-y-4">
        
        <!-- ADMIN LOGIN / HEADER -->
        <div class="bg-white rounded-3xl p-5 shadow-lg space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <div class="flex items-center gap-2">
                    <div class="bg-emerald-100 text-emerald-700 p-2.5 rounded-2xl">
                        <i class="fa-solid fa-shield-halved text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-extrabold text-gray-800 text-base leading-none">DUKATRACK Admin</h1>
                        <span class="text-[10px] text-gray-400">Platform Management Portal</span>
                    </div>
                </div>
                <a href="index.html" class="text-xs bg-gray-100 text-gray-600 hover:bg-gray-200 px-3 py-1.5 rounded-xl font-bold">
                    ← Back to Duka POS
                </a>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div class="bg-emerald-50 p-3 rounded-2xl border border-emerald-100">
                    <div class="text-[10px] text-emerald-700 font-bold uppercase">Total Shops</div>
                    <div id="adminTotalShops" class="text-xl font-extrabold text-emerald-900">0</div>
                </div>
                <div class="bg-emerald-50 p-3 rounded-2xl border border-emerald-100">
                    <div class="text-[10px] text-emerald-700 font-bold uppercase">Cloud Status</div>
                    <div id="adminCloudStatus" class="text-xs font-bold text-emerald-800 mt-1">Connected 🟢</div>
                </div>
            </div>
        </div>

        <!-- REGISTERED SHOPS TABLE FROM SUPABASE -->
        <div class="bg-white rounded-3xl p-5 shadow-lg space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-gray-800 text-sm flex items-center gap-1.5">
                    <i class="fa-solid fa-shop text-emerald-600"></i> All Connected Dukas
                </h2>
                <button onclick="loadAdminData()" class="text-xs text-emerald-600 font-bold hover:underline">Refresh</button>
            </div>
            <div id="adminShopList" class="space-y-2">
                <p class="text-xs text-gray-400 italic">Fetching cloud records...</p>
            </div>
        </div>

    </div>

    <!-- ADMIN JAVASCRIPT ENGINE -->
    <script>
        const SUPABASE_URL = "https://torzbgvwjhthzuifdses.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRvcnpiZ3Z3amh0aHp1aWZkc2VzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyODQ4OTAsImV4cCI6MjEwODg2MDg5MH0.Jjzgt-mCxA94Y1lG6fLDLupteE8RZs6dygJO5BVClKY";
        const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

        async function loadAdminData() {
            // Optional basic prompt password protection
            const pwd = prompt("Enter Super Admin Access Key:", "admin254");
            if (pwd !== "admin254") {
                alert("Incorrect Key!");
                window.location.href = "index.html";
                return;
            }

            if (!supabase) {
                document.getElementById('adminShopList').innerHTML = `<p class="text-xs text-red-500">Supabase client failed to load.</p>`;
                return;
            }

            const { data: dukas, error } = await supabase.from('dukas').select('*').order('created_at', { ascending: false });
            
            if (error) {
                document.getElementById('adminShopList').innerHTML = `<p class="text-xs text-red-500">Error fetching cloud shops.</p>`;
                return;
            }

            document.getElementById('adminTotalShops').innerText = dukas ? dukas.length : 0;
            
            const listElem = document.getElementById('adminShopList');
            listElem.innerHTML = '';

            if (!dukas || dukas.length === 0) {
                listElem.innerHTML = `<p class="text-xs text-gray-400 italic">No shops registered in the cloud yet.</p>`;
                return;
            }

            dukas.forEach(d => {
                listElem.innerHTML += `
                    <div class="bg-gray-50 p-3 rounded-2xl border border-gray-100 flex justify-between items-center">
                        <div>
                            <div class="font-bold text-gray-800 text-sm">🛒 ${d.name}</div>
                            <div class="text-xs text-gray-400">📱 ${d.phone} • 📍 ${d.location || 'Mwea'}</div>
                        </div>
                        <span class="text-[10px] bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-bold">Active</span>
                    </div>
                `;
            });
        }

        loadAdminData();
    </script>
</body>
</html>
